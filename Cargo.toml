[package]
name = "luxeharness"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A native workspace for coding agents across providers"
publish = false

[dependencies]
iced = { version = "=0.14.0", features = ["svg", "tokio", "canvas"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "process", "io-util", "macros"] }
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
httpdate = "1"

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = 1
